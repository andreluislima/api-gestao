<div class="container-fluid p-3">
  <div class="sub-title p-2 mb-2">
    <h2 class="m-0">Despesas</h2>
  </div>

  <!-- Linha 1: período + ação -->
  <div class="row g-2 align-items-center mb-2 controle-form p-3">
    <div class="col-12 col-md-6">
      <span class="badge bg-primary px-3 py-2">Janeiro/26</span>
    </div>

    <div class="col-12 col-md-6 text-md-end">
      <button class="btn btn-success">Adicionar</button>
    </div>
  </div>

  <!-- Linha 2: busca + totais -->
  <div class="row g-2 align-items-end mb-3 controle-form p-2">
    <div class="col-12 col-lg-6">
      <label class="form-label">Pesquisar</label>
      <input type="search" class="form-control" placeholder="Pesquisar por descrição/empresa" />
    </div>

    <div class="col-6 col-lg-3">
      <label class="form-label">Total</label>
      <input type="text" class="form-control" readonly />
    </div>

    <div class="col-6 col-lg-3">
      <label class="form-label">Pagos</label>
      <input type="text" class="form-control" readonly />
    </div>
  </div>

  <!-- Tabela -->
  <div class="card">
    <p-table
      [value]="despesas"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[10, 25, 50]"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords}"
      responsiveLayout="stack"
      breakpoint="960px"
      (onPage)="pageChange($event)"
    >
      <ng-template pTemplate="header">
        <tr>
          <th style="width: 12rem">Data</th>
          <th>Descrição</th>
          <th style="width: 16rem">Empresa</th>
          <th style="width: 16rem">Forma de pagamento</th>
          <th style="width: 12rem" class="text-end">Valor</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-d>
        <tr>
          <td><span class="p-column-title">Data</span>{{ d.data | date : 'dd/MM/yyyy' }}</td>
          <td><span class="p-column-title">Descrição</span>{{ d.descricao }}</td>
          <td><span class="p-column-title">Empresa</span>{{ d.empresa }}</td>
          <td><span class="p-column-title">Forma</span>{{ d.formaPagamento }}</td>
          <td class="text-end">
            <span class="p-column-title">Valor</span>{{ d.valor | currency : 'BRL' }}
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
