<div class="container-fluid p-3">
  <div class="sub-title p-2 mb-3">
    <h2 class="m-0">Inserir Despesa</h2>
  </div>

  <form class="form-despesa mat-elevation-z2 p-4">
    <fieldset class="fieldset-custom">

      <legend>Informações</legend>

      <div class="row g-3">

        <!-- Data -->
        <div class="col-12 col-md-2">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Data</mat-label>
            <input matInput type="date" />
          </mat-form-field>
        </div>

        <!-- Descrição -->
        <div class="col-12 col-md-6">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Descrição do Pagamento</mat-label>
            <input matInput placeholder="Ex: Conta de luz" />
          </mat-form-field>
        </div>

        <!-- Forma de pagamento -->
        <div class="col-12 col-md-4">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Forma de Pagamento</mat-label>
            <mat-select>
              <mat-option value="credito">Crédito</mat-option>
              <mat-option value="debito">Débito</mat-option>
              <mat-option value="pix">PIX</mat-option>
              <mat-option value="boleto">Boleto</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <!-- Empresa -->
        <div class="col-12 col-md-6">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Empresa</mat-label>
            <input matInput placeholder="Ex: Enel" />
          </mat-form-field>
        </div>

        <!-- Valor -->
        <div class="col-12 col-md-4">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Valor</mat-label>
            <input matInput type="number" placeholder="0,00" />
          </mat-form-field>
        </div>

        <!-- Observação -->
        <div class="col-12">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Informações Complementares</mat-label>
            <textarea matInput rows="3"></textarea>
          </mat-form-field>
        </div>

      </div>
    </fieldset>

    <fieldset class="fieldset-custom mt-3">
      <legend>Anexos</legend>
       <div class="col-12 col-md-12">
        <mat-form-field appearance="outline" class="w-100">
        <mat-label>Anexo</mat-label>

        <input
          matInput
          placeholder="Nenhum arquivo selecionado"
          [value]="fileName"
          readonly
        />

        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="fileInput.click()"
        >
          <mat-icon>attach_file</mat-icon>
        </button>
      </mat-form-field>

      <input
        #fileInput
        type="file"
        hidden
        (change)="onFileSelected($event)"
      />

       </div>

    </fieldset>

    <!-- Ações -->
    <div class="row mt-3">
      <div class="col-12 d-flex gap-2">
        <button mat-stroked-button color="warn">Cancelar</button>
        <button mat-raised-button color="primary">Salvar</button>
      </div>
    </div>

  </form>
</div>
